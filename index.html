<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Download Hub</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #0a0e27;
  font-family: 'Segoe UI', Roboto, Arial, sans-serif;
  color: #fff;
  overflow-x: hidden;
  position: relative;
  min-height: 100vh;
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
}

.content {
  position: relative;
  z-index: 10;
  padding: 20px;
}

.header {
  text-align: center;
  margin-bottom: 20px;
}

.logo {
  width: 150px;
  height: 150px;
  margin: 0 auto 15px;
}

.logo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.subtitle {
  font-size: 16px;
  color: #00c8ff;
  font-weight: 300;
}

.search-section {
  max-width: 600px;
  margin: 0 auto 30px;
}

.search-title {
  font-size: 14px;
  color: #00c8ff;
  font-weight: 700;
  letter-spacing: 1px;
  margin-bottom: 12px;
  text-align: center;
}

.search-box {
  position: relative;
}

.search-box input {
  width: 100%;
  padding: 10px 15px 10px 40px;
  border: 2px solid #00c8ff;
  border-radius: 25px;
  background: rgba(0, 200, 255, 0.1);
  color: #fff;
  font-size: 13px;
  transition: all 0.3s ease;
}

.search-box input:focus {
  outline: none;
  background: rgba(0, 200, 255, 0.2);
  box-shadow: 0 0 20px rgba(0, 200, 255, 0.3);
}

.search-box input::placeholder {
  color: rgba(255, 255, 255, 0.5);
}

.search-icon {
  position: absolute;
  left: 15px;
  top: 50%;
  transform: translateY(-50%);
  color: #00c8ff;
  font-size: 16px;
}

.games-container {
  display: flex;
  justify-content: center;
  gap: 35px;
  padding: 0;
  flex-wrap: wrap;
  align-items: flex-start;
  margin-bottom: 30px;
  max-width: 600px;
  margin-left: auto;
  margin-right: auto;
}

.game-card {
  background: rgba(15, 30, 60, 0.9);
  border: 2px solid rgba(0, 200, 255, 0.4);
  border-radius: 20px;
  padding: 12px;
  text-align: center;
  transition: all 0.3s ease;
  cursor: pointer;
  backdrop-filter: blur(10px);
  width: 160px;
  flex-basis: calc(33.333% - 24px);
}

.game-card:hover {
  border-color: #00c8ff;
  box-shadow: 0 0 20px rgba(0, 200, 255, 0.4);
  transform: translateY(-5px);
}

.game-card.hidden {
  display: none;
}

.game-image {
  width: 100px;
  height: 100px;
  margin: 0 auto 10px;
  border-radius: 15px;
  overflow: hidden;
  background: rgba(0, 200, 255, 0.1);
}

.game-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.game-name {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 12px;
  color: #fff;
  font-family: 'Space Mono', monospace;
  line-height: 1.3;
}

.install-btn {
  background: linear-gradient(135deg, #00c8ff 0%, #0072ff 100%);
  color: white;
  border: none;
  padding: 10px 25px;
  border-radius: 25px;
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
  width: 100%;
  font-family: 'Space Mono', monospace;
}

.install-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 15px rgba(0, 200, 255, 0.5);
}

.install-btn:active {
  transform: scale(0.98);
}

.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.9);
  z-index: 1000;
  overflow-y: auto;
}

.modal.show {
  display: block;
}

.modal-close {
  position: fixed;
  top: 20px;
  right: 20px;
  background: rgba(255, 255, 255, 0.2);
  border: none;
  color: white;
  font-size: 28px;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  cursor: pointer;
  z-index: 1001;
  transition: all 0.3s ease;
}

.modal-close:hover {
  background: rgba(255, 255, 255, 0.4);
}

.footer {
  text-align: center;
  padding: 20px;
  font-size: 12px;
  color: #00c8ff;
  margin-top: 0;
  border-top: none;
}

.footer-title {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 10px;
  font-family: 'Orbitron', sans-serif;
}

.footer-text {
  font-size: 11px;
  color: rgba(255, 255, 255, 0.6);
  margin-top: 8px;
}

@media (max-width: 768px) {
  .games-container {
    padding: 0 10px;
  }
  .game-card {
    width: 140px;
    flex-basis: calc(33.333% - 24px);
  }
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="content">
  <div class="header">
    <div class="logo">
      <img src="https://i.ibb.co/k2QRdCrK/Picsart-26-06-07-15-50-46-423.png" alt="Logo">
    </div>
    <p class="subtitle">Download Your Favorite Games</p>
  </div>

  <div class="search-section">
    <div class="search-title">SEARCH OUR LIBRARY</div>
    <div class="search-box">
      <i class="fas fa-search search-icon"></i>
      <input type="text" id="searchInput" placeholder="Your search term...">
    </div>
  </div>

  <div class="games-container" id="gamesContainer">
    <div class="game-card" data-game="zepeto">
      <div class="game-image">
        <img src="https://ontweak.com/ontweak_files/zepeto.png" alt="ZEPETO">
      </div>
      <div class="game-name">ZEPETO</div>
      <button class="install-btn" onclick="openModal('zepeto')">Install</button>
    </div>

    <div class="game-card" data-game="imvu">
      <div class="game-image">
        <img src="https://ontweak.com/ontweak_files/imvu.png" alt="IMVU">
      </div>
      <div class="game-name">IMVU</div>
      <button class="install-btn" onclick="openModal('imvu')">Install</button>
    </div>

    <div class="game-card" data-game="miside">
      <div class="game-image">
        <img src="https://ontweak.com/ontweak_files/miside.png" alt="MISIDE">
      </div>
      <div class="game-name">MISIDE</div>
      <button class="install-btn" onclick="openModal('miside')">Install</button>
    </div>

    <div class="game-card" data-game="toptycoon">
      <div class="game-image">
        <img src="https://ontweak.com/ontweak_files/toptycoon.png" alt="TOP TYCOON">
      </div>
      <div class="game-name">TOP TYCOON</div>
      <button class="install-btn" onclick="openModal('toptycoon')">Install</button>
    </div>

    <div class="game-card" data-game="bloonstd6">
      <div class="game-image">
        <img src="https://i.ibb.co/qMsRvLJR/download-1.jpg" alt="BLOONS TD 6">
      </div>
      <div class="game-name">BLOONS TD 6</div>
      <button class="install-btn" onclick="openModal('bloonstd6')">Install</button>
    </div>
  </div>

  <div class="footer">
    <div class="footer-title">GENPAC</div>
    <div class="footer-text">© 2026 All Rights Reserved. Your ultimate gaming hub for tweaked apps and premium resources.</div>
  </div>
</div>

<!-- Modals -->
<div class="modal" id="zepetoModal">
  <button class="modal-close" onclick="closeModal('zepeto')">×</button>
  <iframe id="zepetoFrame" style="width: 100%; height: 100%; border: none;"></iframe>
</div>

<div class="modal" id="imvuModal">
  <button class="modal-close" onclick="closeModal('imvu')">×</button>
  <iframe id="imvuFrame" style="width: 100%; height: 100%; border: none;"></iframe>
</div>

<div class="modal" id="misideModal">
  <button class="modal-close" onclick="closeModal('miside')">×</button>
  <iframe id="misideFrame" style="width: 100%; height: 100%; border: none;"></iframe>
</div>

<div class="modal" id="toptycoonModal">
  <button class="modal-close" onclick="closeModal('toptycoon')">×</button>
  <iframe id="toptycoonFrame" style="width: 100%; height: 100%; border: none;"></iframe>
</div>

<div class="modal" id="bloonstd6Modal">
  <button class="modal-close" onclick="closeModal('bloonstd6')">×</button>
  <iframe id="bloonstd6Frame" style="width: 100%; height: 100%; border: none;"></iframe>
</div>

<script>
// Animated background
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const particles = [];
const particleCount = 50;

class Particle {
  constructor() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.vx = (Math.random() - 0.5) * 0.5;
    this.vy = (Math.random() - 0.5) * 0.5;
    this.radius = Math.random() * 2 + 1;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    if (this.x < 0) this.x = canvas.width;
    if (this.x > canvas.width) this.x = 0;
    if (this.y < 0) this.y = canvas.height;
    if (this.y > canvas.height) this.y = 0;
  }

  draw() {
    ctx.fillStyle = 'rgba(0, 200, 255, 0.6)';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fill();
  }
}

for (let i = 0; i < particleCount; i++) {
  particles.push(new Particle());
}

function drawLines() {
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const distance = Math.sqrt(dx * dx + dy * dy);
      if (distance < 150) {
        ctx.strokeStyle = `rgba(0, 200, 255, ${0.2 * (1 - distance / 150)})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.stroke();
      }
    }
  }
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(particle => {
    particle.update();
    particle.draw();
  });
  drawLines();
  requestAnimationFrame(animate);
}

animate();

window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

// Search
document.getElementById('searchInput').addEventListener('keyup', function() {
  const searchTerm = this.value.toLowerCase();
  const gameCards = document.querySelectorAll('.game-card');
  gameCards.forEach(card => {
    const gameName = card.getAttribute('data-game').toLowerCase();
    if (gameName.includes(searchTerm) || searchTerm === '') {
      card.classList.remove('hidden');
    } else {
      card.classList.add('hidden');
    }
  });
});

// Modal functions
function openModal(game) {
  const modal = document.getElementById(game + 'Modal');
  const frame = document.getElementById(game + 'Frame');
  if (modal && frame) {
    frame.src = game + '.html';
    modal.classList.add('show');
    document.body.style.overflow = 'hidden';
  }
}

function closeModal(game) {
  const modal = document.getElementById(game + 'Modal');
  if (modal) {
    modal.classList.remove('show');
    document.body.style.overflow = 'auto';
  }
}

document.querySelectorAll('.modal').forEach(modal => {
  modal.addEventListener('click', function(e) {
    if (e.target === this) {
      const game = this.id.replace('Modal', '');
      closeModal(game);
    }
  });
});
</script>

</body>
</html>
